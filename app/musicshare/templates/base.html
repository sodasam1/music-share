<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% if noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<title>{% block title %}Music{% endblock %}</title>
<meta property="og:title" content="{% block ogtitle %}Music{% endblock %}">
<meta property="og:description" content="{% block ogdesc %}Listen{% endblock %}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
<link rel="stylesheet" href="{{ asset('bundle-public.css') }}">
<script src="{{ asset('minimal/theme.js') }}"></script>
<script src="{{ asset('bundle-public.js') }}" defer></script>
</head>
<body>
<div class="wrap">
<header class="page-head"><a class="brand" href="{{ base }}/">{% include "_logo.html" %}Music</a><span class="spacer"></span>{% if owner %}<a class="quiet" href="{{ base }}/studio">Studio</a>{% endif %}</header>
{% block body %}{% endblock %}
</div>
<div class="player-bar" id="bar" hidden>
  <div class="inner">
    <button class="play-btn small" id="bar-play" type="button" aria-label="Play" data-state="play"></button>
    <div class="bar-text"><div class="bar-title" id="bar-title"></div>
      <div class="bar-progress" id="bar-progress" role="slider" tabindex="0" aria-label="Position in the track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar-fill" id="bar-fill"></div></div></div>
    <span class="bar-time" id="bar-time"></span>
  </div>
</div>
</body>
</html>
